general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    #before_sleep_cmd = pidof hyprlock || hyprlock    # lock before suspend.
    after_sleep_cmd = 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}
'hl.dsp.dpms({ action = "disable" })'

listener {
    timeout = 900                                 # 15min
    on-timeout = pidof hyprlock || hyprlock
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 960                                 # 16min
    on-timeout = 'hl.dsp.dpms({ action = "disable" })'        # screen off when timeout has passed
    on-resume = 'hl.dsp.dpms({ action = "enable" })'          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 3600                                # 1h
    on-timeout = systemctl suspend                # suspend pc
}
